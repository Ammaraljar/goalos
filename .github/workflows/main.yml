name: Build GoalOS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix code issues
        run: |
          sed -i "/part '.*\.g\.dart';/d" lib/data/models/goal_model.dart
          sed -i "/part '.*\.g\.dart';/d" lib/data/models/task_model.dart
          sed -i "/part '.*\.g\.dart';/d" lib/data/models/habit_model.dart
          sed -i "/part '.*\.g\.dart';/d" lib/data/models/time_block_model.dart
          grep -rl "TextDirection.rtl" lib/ | xargs sed -i 's/textDirection: TextDirection\.rtl,//g'
          grep -rl "TextDirection.ltr" lib/ | xargs sed -i 's/TextDirection\.ltr/TextDirection.values[0]/g'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create --platforms android .
          sed -i 's/applicationId .*/applicationId "com.goalos.app"/' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalOS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
